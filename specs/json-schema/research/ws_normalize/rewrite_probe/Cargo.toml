[package]
name = "ws_rewrite_probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "explore"
path = "src/explore.rs"

[[bin]]
name = "rewrite"
path = "src/rewrite.rs"

[[bin]]
name = "normalize_corpus"
path = "src/normalize_corpus.rs"

[[bin]]
name = "edge"
path = "src/edge.rs"

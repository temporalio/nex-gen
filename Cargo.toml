[package]
name = "nex-gen"
version = "0.1.2"
edition = "2024"
description = "Generate language-specific Nexus operation bindings from WIT"
license = "MIT"
repository = "https://github.com/temporalio/nex-gen"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
heck = "0.5"
indexmap = { version = "2.7", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
tempfile = "3.23"
thiserror = "2.0"
wit-parser = "0.250"

# Sample input for nex-gen — the multi-file closure entry point.
#
# A small knowledge-base service whose types live across several schema
# files under nested directories. This is the Nexus document (root
# `nexusrpc` marker); it declares one service and three operations that
# reach types by cross-file `$ref`. It deliberately exercises the
# multi-input points in json-schema/generated-file-layout.md:
#
#   * flattened module names from nested input directories
#     (content/page.json -> module `content_page`);
#   * a shared `definitions` file + a re-exporting aggregator;
#   * a cross-file recursion cycle (Page <-> Block) that Python hoists
#     into `_recursive.py`;
#   * a within-file self-cycle (Category tree) that stays in its module;
#   * synthesized operation I/O types placed in this file's module,
#     sharing its namespace with the service binding.
nexusrpc: "1.0.0"
$schema: https://json-schema.org/draft/2020-12/schema
description: A knowledge-base service whose types span several schema files.

services:
  KnowledgeBaseService:
    fqn: example.kb.v1.KnowledgeBaseService
    description: Fetch and update pages, blocks, and the category tree.
    operations:
      getPage:
        description: Fetch a page by id.
        # Inline object input -> synthesized GetPageInput (lives in this module).
        input:
          type: object
          additionalProperties: false
          properties:
            pageId: { type: string }
          required: [pageId]
        # Cross-file root ref -> Page (content/page.json).
        output: { $ref: 'content/page.json' }

      putBlock:
        description: Create or update a content block.
        # Cross-file root ref -> Block (content/block.json).
        input: { $ref: 'content/block.json' }
        # Inline object output -> synthesized PutBlockOutput.
        output:
          type: object
          additionalProperties: false
          properties:
            blockId: { type: string }
            revision: { type: integer }
          required: [blockId, revision]

      getCategoryTree:
        description: Fetch the category tree rooted at a category.
        input:
          type: object
          additionalProperties: false
          properties:
            rootId: { type: string }
          required: [rootId]
        # Cross-file root ref -> Category (tree/category.json).
        output: { $ref: 'tree/category.json' }

name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6255b92812bf51d292e488b61469267a391267f6 # stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: samples/python

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            samples/typescript/package-lock.json
            advanced/samples/typescript/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: samples/go/go.mod
          cache-dependency-path: |
            samples/go/go.sum
            advanced/samples/go/go.sum

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The sample libraries target net8.0 and their test projects target
          # net9.0, so both runtimes have to be present. `cargo test` also shells
          # out to `dotnet build` from tests/generate_dotnet.rs, which relied on
          # whatever SDK the runner happened to preinstall until this step.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install Python dependencies (samples)
        working-directory: samples/python
        run: uv sync --locked

      - name: Install Python dependencies (advanced)
        working-directory: advanced/samples/python
        run: uv sync --locked

      - name: Install TypeScript dependencies (samples)
        working-directory: samples/typescript
        run: npm ci

      - name: Install TypeScript dependencies (advanced)
        working-directory: advanced/samples/typescript
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --features advanced

      - name: Check Python formatting (samples)
        working-directory: samples/python
        run: uv run ruff format --check .

      - name: Check Python formatting (advanced)
        working-directory: advanced/samples/python
        run: uv run ruff format --check .

      - name: Check TypeScript formatting (samples)
        working-directory: samples/typescript
        run: npm exec -- prettier --check .

      - name: Check TypeScript formatting (advanced)
        working-directory: advanced/samples/typescript
        run: npm exec -- prettier --check .

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l samples/go advanced/samples/go)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Run Go tests (samples)
        working-directory: samples/go
        run: go test ./...

      - name: Run Go tests (advanced)
        working-directory: advanced/samples/go
        run: go test ./...

      - name: Run Python tests (samples)
        working-directory: samples/python
        run: uv run pytest

      - name: Run Python tests (advanced)
        working-directory: advanced/samples/python
        run: uv run pytest

      - name: Run Java tests (samples)
        working-directory: samples/java
        run: ./gradlew build --no-daemon

      - name: Run Java tests (advanced)
        working-directory: advanced/samples/java
        run: ./gradlew build --no-daemon

      - name: Run .NET tests (samples)
        working-directory: samples/dotnet
        run: dotnet test tests/ --nologo

      - name: Run .NET tests (advanced)
        working-directory: advanced/samples/dotnet
        run: dotnet test tests/ --nologo

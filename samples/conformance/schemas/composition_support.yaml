$schema: https://json-schema.org/draft/2020-12/schema
title: CompositionSupport
description: Cross-file and recursive definitions consumed by composition-main.
type: object
additionalProperties: false
properties: {}
$defs:
  External:
    type: object
    additionalProperties: false
    required: [code]
    properties:
      code:
        type: string
        minLength: 2
  Node:
    type: object
    additionalProperties: false
    required: [label]
    properties:
      label:
        type: string
        minLength: 2
      children:
        type: array
        items:
          $ref: "#/$defs/Node"

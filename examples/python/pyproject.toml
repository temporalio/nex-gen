[project]
name = "examples-python"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "basedpyright==1.31.4",
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    "temporalio",
    "typing_extensions>=4.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
temporalio = { path = "../../../temporal-sdk-python" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../../../temporal-sdk-python"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.basedpyright]
exclude = [".venv"]
extraPaths = ["../../../temporal-sdk-python"]
reportAny = false
reportExplicitAny = false
reportUnnecessaryTypeIgnoreComment = "error"

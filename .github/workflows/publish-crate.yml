name: Publish crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish crate
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publishing must be run from main; got ${GITHUB_REF}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6255b92812bf51d292e488b61469267a391267f6 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"

      - name: Read crate metadata
        id: crate
        run: |
          manifest_path="$(realpath Cargo.toml)"
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          name="$(jq -r --arg manifest_path "$manifest_path" '.packages[] | select(.manifest_path == $manifest_path) | .name' <<<"$metadata")"
          version="$(jq -r --arg manifest_path "$manifest_path" '.packages[] | select(.manifest_path == $manifest_path) | .version' <<<"$metadata")"

          if [[ -z "$name" || "$name" == "null" || -z "$version" || "$version" == "null" ]]; then
            echo "failed to read package name/version from cargo metadata"
            exit 1
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=v$version"
          } >>"$GITHUB_OUTPUT"

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.crate.outputs.tag }}
          RELEASE_TITLE: ${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$RELEASE_TITLE" \
            --generate-notes
